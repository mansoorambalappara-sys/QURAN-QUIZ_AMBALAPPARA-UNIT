["'قَدْ أَفْلَحَ' എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?","തീർച്ചയായും വിജയിച്ചിരിക്കുന്നു","തീർച്ചയായും നഷ്ടപ്പെട്ടിരിക്കുന്നു","തീർച്ചയായും ഉറങ്ങിയിരിക്കുന്നു","തീർച്ചയായും യാത്ര ചെയ്തിരിക്കുന്നു"],
["'سُلَالَةٍ' (സുലാലത്) എന്ന വാക്കിന്റെ അർത്ഥം എന്ത്?","സത്ത്","വെള്ളം","പൊടി","അസ്ഥി"],
["'سِينَاء' (സീനാ) എന്നത് എന്തുമായി ബന്ധപ്പെട്ട പ്രദേശമാണ്?","ഒലിവ് മരങ്ങളും സീനാപർവ്വതവും സ്ഥിതി ചെയ്യുന്ന പ്രദേശം","ഈന്തപ്പനകൾ മാത്രം വളരുന്ന മരുഭൂമി","മുന്തിരിത്തോട്ടങ്ങൾ നിറഞ്ഞ താഴ്‌വര","ഒരു വലിയ കടലിന്റെ തീരം"]];
const fa=t=>t.replace(/[\u0600-\u06FF][\u0600-\u06FF\s]*[\u0600-\u06FF]/g,m=>'<span class="ar" dir="rtl">'+m+'</span>');
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let me,i=0,sc=0,t0,iv,pw,pubd;
function show(id){document.querySelectorAll('.pg').forEach(e=>e.hidden=e.id!=id)}
async function api(o){const r=await fetch(API+'?'+new URLSearchParams(o));return r.json()}
const fm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function start(){const n=$('#nm').value.trim(),p=$('#ph').value.trim();
 if(n.length<2||!/^\d{10}$/.test(p))return $('#msg').textContent='പേരും 10 അക്ക ഫോൺ നമ്പറും നൽകുക';
 $('#msg').textContent='ദയവായി കാത്തിരിക്കുക...';
 try{const r=await api({a:'chk',ph:p});if(r.dup)return $('#msg').textContent='ഈ നമ്പർ ഉപയോഗിച്ച് നേരത്തെ പങ്കെടുത്തിട്ടുണ്ട്';}catch(e){return $('#msg').textContent='കണക്ഷൻ പരാജയപ്പെട്ടു'}
 me={n,p};i=0;sc=0;t0=Date.now();$('#msg').textContent='';show('quiz');
 iv=setInterval(()=>$('#tm').textContent='⏱ '+fm(Math.round((Date.now()-t0)/1000)),500);nq()}
function nq(){if(i>=Q.length)return fin();const q=Q[i];$('#no').textContent='ചോദ്യം '+(i+1)+' / '+Q.length;$('#pb').style.width=(i/Q.length*100)+'%';$('#qq').innerHTML=fa(q[0]);
 $('#op').innerHTML='';sh(q.slice(1).map((t,k)=>[t,k==0])).forEach(([t,ok])=>{const b=document.createElement('button');b.className='b o';b.innerHTML=fa(t);
 b.onclick=()=>{if(b.dataset.d)return;document.querySelectorAll('.o').forEach(x=>x.dataset.d=1);b.classList.add('s');if(ok)sc++;i++;setTimeout(nq,450)};$('#op').appendChild(b)})}
async function fin(){clearInterval(iv);$('#pb').style.width='100%';const sec=Math.round((Date.now()-t0)/1000);
 try{await api({a:'submit',n:me.n,ph:me.p,s:sc,sec});}catch(e){alert('സമർപ്പിക്കാൻ കഴിഞ്ഞില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക');}show('done')}
function tbl(r,adm){const m=['🥇','🥈','🥉'];return '<table><tr><th>#</th><th>പേര്</th>'+(adm?'<th>ഫോൺ</th>':'')+'<th>മാർക്ക്</th><th>സമയം</th>'+(adm?'<th></th>':'')+'</tr>'+r.map((x,k)=>'<tr><td>'+(m[k]||k+1)+'</td><td>'+esc(x.n)+'</td>'+(adm?'<td>'+esc(x.ph)+'</td>':'')+'<td>'+x.s+'/'+Q.length+'</td><td>'+fm(x.sec)+'</td>'+(adm?'<td><button onclick="del(\''+esc(x.ph)+'\')" style="background:#d9363e;color:#fff;border:0;border-radius:8px;padding:5px 9px;cursor:pointer">🗑</button></td>':'')+'</tr>').join('')+'</table>'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function board(){try{const r=await api({a:'board'});if(!r.ok)return $('#msg').textContent='ഫലം ഇതുവരെ പ്രസിദ്ധീകരിച്ചിട്ടില്ല';$('#rt').innerHTML=tbl(r.rows);show('res')}catch(e){$('#msg').textContent='കണക്ഷൻ പരാജയപ്പെട്ടു'}}
async function admin(f){if(f)pw=prompt('അഡ്മിൻ പാസ്‌വേഡ്');if(!pw)return;try{const r=await api({a:'admin',pw});if(!r.ok){pw=null;return alert('തെറ്റായ പാസ്‌വേഡ്')}
 pubd=r.pub;$('#ai').innerHTML='<span>പങ്കെടുത്തവർ: '+r.rows.length+'</span><span>'+(pubd?'✅ പ്രസിദ്ധീകരിച്ചു':'🔒 മറച്ചിരിക്കുന്നു')+'</span>';
 $('#pubb').textContent=pubd?'🔒 ഫലം മറയ്ക്കുക':'📢 ഫലം പ്രസിദ്ധീകരിക്കുക';$('#at').innerHTML=tbl(r.rows,1);show('adm')}catch(e){alert('കണക്ഷൻ പരാജയപ്പെട്ടു')}}
async function del(ph){if(!confirm('ഈ എൻട്രി ഡിലീറ്റ് ചെയ്യണോ? ('+ph+')'))return;await api({a:'del',pw,ph});admin()}
async function delall(){if(!confirm('എല്ലാ പങ്കാളികളുടെയും വിവരങ്ങൾ ഡിലീറ്റ് ചെയ്യണോ?'))return;if(!confirm('ഉറപ്പാണോ? ഇത് തിരികെ എടുക്കാൻ കഴിയില്ല'))return;await api({a:'delall',pw});admin()}
async function pub(){await api({a:'publish',pw,v:pubd?0:1});admin()}
</script></body></html>
